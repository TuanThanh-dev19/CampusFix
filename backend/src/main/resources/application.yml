spring:
  application:
    name: campusfix-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusfix}
    username: ${DB_USERNAME:campusfix}
    password: ${DB_PASSWORD:campusfix_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # Local fallback only. Set JWT_SECRET outside local development.
    jwt-secret: ${JWT_SECRET:change-this-local-development-secret-32bytes}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
